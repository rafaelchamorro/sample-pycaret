<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Predicción del Costo del Seguro Médico</title>
  <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Arimo' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Hind:300' rel='stylesheet' type='text/css'>
<link href='https://fonts.googleapis.com/css?family=Open+Sans+Condensed:300' rel='stylesheet' type='text/css'>
<link type="text/css" rel="stylesheet" href="{{ url_for('static', filename='./style.css') }}">
  
</head>

<body>
 <div class="login">
	<h1>Predicción del Costo del Seguro Médico</h1>

     <!-- Form to enter new data for predictions  -->
    <form action="{{ url_for('predict')}}"method="POST">
      <input type="text" name="age" placeholder="Edad (Age)" required="required" /><br>
    	<input type="text" name="sex" placeholder="Sexo (male/female)" required="required" /><br>
        <input type="text" name="bmi" placeholder="IMC / BMI" required="required" /><br>
        <input type="text" name="children" placeholder="Hijos (Children)" required="required" /><br>
        <input type="text" name="smoker" placeholder="Fumador (yes/no)" required="required" /><br>
        <input type="text" name="region" placeholder="Región (ej: northeast)" required="required" /><br>

        <button type="submit" class="btn btn-primary btn-block btn-large">Calcular Costo del Seguro</button>
    </form>

   <br>
   <br>
  
   
 </div>
 {{pred}}

</body>
</html>
